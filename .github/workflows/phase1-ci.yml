name: StreamHub checks
on:
  push:
    branches: [main, 'phase1-*', 'phase2-*', 'phase3-*', 'phase4-*', 'phase5-*', 'phase6-*', 'phase7-*', 'phase8-*']
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compatibility and subtitle tests
        run: node --test backend/test/*.test.js frontend/test/*.test.js
      - name: Database migration compatibility and backup safety
        run: |
          python3 tests/migration.test.py
          python3 tests/advanced-migration.test.py
          python3 tests/phase4-migration.test.py
          python3 tests/test_recovery.py
          python3 tests/phase6-migration.test.py
          python3 tests/phase7-migration.test.py
      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund
      - name: Verify HTTP profile isolation and watch-party permissions
        run: node --test backend/integration/*.test.js
      - name: Validate backend JavaScript
        run: |
          node --check backend/episode-following.js
          node --check backend/episode-following-rules.js
          node --check backend/community-db.js
          node --check backend/engagement.js
          node --check backend/security-rules.js
          node --check backend/metadata-match.js
          node --check backend/local-subtitles.js
          node --check backend/community-rules.js
          node --check backend/local-media.js
          node --check backend/local-media-rules.js
          node --check backend/advanced-rules.js
          node --check backend/advanced-db.js
          node --check backend/advanced-worker.js
          node --check backend/premium.js
          node --check backend/preview.js
          node --check backend/tmdb.js
          node --check backend/cast-token.js
          node --check backend/push-rules.js
          node --check backend/push.js
          node --check backend/server.js
          node --check backend/db.js
          node --check backend/admin.js
          node --check backend/auth.js
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

  browser:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium browser testing dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Real offline PWA roundtrip in Chromium
        run: python tests/test_offline_browser.py
