server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # The HTML shell is never cached, so a new build is picked up immediately
    # (browsers and Cloudflare would otherwise keep serving a stale version).
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Built assets have content hashes in their names — cache them forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }

    # Long-running, never-buffered responses: file downloads and the audio-fix video stream.
    location /api/download {
        proxy_pass http://backend:4000/api/download;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/audiofix/ {
        proxy_pass http://backend:4000/api/audiofix/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API -> Express backend (internal Docker network)
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        add_header Cache-Control "no-store" always;
    }

    # Every video request is checked against the login session first.
    location = /_auth {
        internal;
        proxy_pass http://backend:4000/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # Video bytes -> TorrServer, with Range support so seeking works.
    location /stream/ {
        auth_request /_auth;
        proxy_pass http://torrserver:8090/stream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Cloudflare caches .mkv/.mp4/.webm paths by default. Cached video would bypass the login
        # check above and breaks Range requests, so tell every cache not to keep it.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }
}
